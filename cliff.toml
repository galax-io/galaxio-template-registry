# git-cliff configuration — https://git-cliff.org
# Release notes from Conventional Commits. Plain, grouped, quiet.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.\n
"""
# Tera template. `<!-- NN -->` prefixes only order the groups; `striptags` drops them.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/galax-io/galaxio-template-registry/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# false, so a commit that ignored the convention reaches the catch-all parser
# instead of being dropped from the notes entirely.
filter_unconventional = false
filter_commits = false
split_commits = false
protect_breaking_commits = true
sort_commits = "newest"
tag_pattern = "v[0-9]*"

# The prefixes this repository actually uses. Order matters: the first match wins.
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 00 -->Breaking changes" },
  { footer = ".*BREAKING CHANGE", group = "<!-- 00 -->Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "<!-- 00 -->Breaking changes" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^chore\\(deps\\)", group = "<!-- 05 -->Dependencies" },
  { message = "^(refactor|test|ci|build|chore|style|revert)", group = "<!-- 06 -->Maintenance" },
  # Catch-all: listed, never dropped.
  { message = ".*", group = "<!-- 07 -->Other" },
]
